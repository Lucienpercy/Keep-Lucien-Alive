</style></head><body><main class="app"><h1>Keep Lucien Alive ♡</h1><p class="sub">Your focus is literally keeping this silly boy alive.</p><div class="scene" id="scene"><div class="sky" id="sky"></div><div class="sun" id="sun">☀️</div><div class="cloud">☁️</div><div class="cloud cloud2">☁️</div><div class="road" id="road"></div><div class="bridge" id="bridge"></div><div class="river" id="river"></div><div class="desk" id="desk">📚 <span>📖</span> ☕</div><div class="activity" id="activity">✏️</div><div id="activity-prop" class="activity-prop">📓</div><div id="activity-label" class="activity-label">Writing little notes</div><div class="bubble" id="bubble">Studying with you! ♡</div><img id="boy" class="boy" src="lucien.png" alt="Cartoon Lucien"/><div id="danger" class="danger"></div><div id="effect" class="effect"></div><div id="caption" class="scene-caption"></div><div id="sparkles" class="sparkles">💗 ✨ 💖 🎉 💗 ✨ 💖</div><div class="ground">🌷🌼🌸🌷🌼</div></div><div id="timer" class="timer">25:00</div><div id="choices" class="choices"><button data-min="5">5m</button><button data-min="15">15m</button><button data-min="25" class="active">25m</button><button data-min="45">45m</button><button data-min="60">60m</button><label>Custom <input id="custom" class="custom" type="number" min="1" max="240" placeholder="min"></label></div><p id="status" class="status">Choose your focus time, my love 💕</p><button id="start" class="primary">Keep Him Alive ❤️</button><button id="reset" class="secondary" hidden>Try again ♡</button><button id="demo" class="secondary">🎬 Preview a disaster</button><div id="note" class="note"></div><p class="hint">Switching tabs or leaving early triggers a disaster when you return. Keep this page visible! ♡</p></main><script>
const notes=["You did it, my love! I'm so proud of you, and I love you more than words can say. ❤️","Congratulations, baby. You've been productive AND kept your boyfriend alive. Truly a woman of many talents.","Every minute you spend working towards your dreams makes me admire you even more.","If I could choose anywhere to be right now, I'd choose right next to you. Preferably annoying you.","You're my favourite person, my favourite notification, and my favourite reason to smile.","I'm so proud of the effort you put into everything, even when nobody else sees it.","You make ordinary days feel like something worth remembering.","You survived the study session. I survived the universe. Our love is unstoppable.","One day, we'll look back on all these little moments and realise how far you've come.","I wish I could give you a massive hug right now. Consider this your official virtual one.","You're clever, beautiful, funny, and somehow still willing to date me. Remarkable.","Just a reminder that I believe in you, even on the days you struggle to believe in yourself.","If you were a star, I'd spend every night looking for you.","I'm very lucky to have you. Also lucky you didn't let me get eaten by a crocodile.","No matter how busy life gets, you'll always be my favourite part of it.","You deserve all the good things you're working so hard for. I'll always be cheering you on.","I love your smile, your laugh, and all the little things that make you you.","Another focus session completed. Another excuse for me to tell you how much I love you.","I'm sending you a thousand kisses, but you'll have to collect them in person.","I hope you know how special you are to me. Not just today, but every single day."];

];let activityTimer=null,activityIndex=-1;function setActivity(next){if(state!=='running')return;activityIndex=next===undefined?(activityIndex+1)%activities.length:next;const a=activities[activityIndex];$('scene').className='scene working mode-'+a.mode;$('activity').textContent=a.hand;$('activity-prop').textContent=a.prop;$('activity-label').textContent=a.label;$('desk').innerHTML=a.desk;$('bubble').textContent=a.bubble;$('status').textContent=a.status}function stopActivities(){clearInterval(activityTimer);activityTimer=null}
const $=id=>document.getElementById(id);let mins=25,state='idle',deadline=0,tick=null,remaining=1500;const key='keep-lucien-session';function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function draw(){ $('timer').textContent=fmt(remaining)}function save(){try{sessionStorage.setItem(key,JSON.stringify({state,deadline,mins}))}catch(e){}}function clear(){try{sessionStorage.removeItem(key)}catch(e){}}function end(){stopActivities();clearInterval(tick);tick=null;$('start').hidden=true;$('reset').hidden=false;$('choices').hidden=true}function win(){if(state!=='running')return;state='won';clear();end();$('scene').className='scene victory';$('boy').className='boy';$('sparkles').classList.add('show');$('caption').textContent='YOU DID IT! 💗';$('status').textContent='YOU KEPT LUCIEN ALIVE!! 🎉';$('timer').textContent='00:00';$('demo').hidden=true;const note=notes[Math.floor(Math.random()*notes.length)];$('note').textContent='💌 '+note+' — Lucien ♡';$('note').classList.add('show')}
function showDisaster(d){$('scene').className='scene disaster '+d.type;$('boy').className='boy';$('danger').textContent=d.emoji;$('danger').className='danger';$('caption').textContent='OH NO!';$('bubble').textContent='AAAAAA!';$('status').textContent='Wait for it… 💀';setTimeout(()=>{$('caption').textContent='RIP LUCIEN 💀';$('status').textContent=d.line+' 💀'},2300)}
function lose(){if(state!=='running')return;state='lost';clear();end();remaining=Math.max(0,(deadline-Date.now())/1000);draw();const d=disasters[Math.floor(Math.random()*disasters.length)];showDisaster(d);$('demo').hidden=true;$('note').textContent='The mission failed. Press Try again to resurrect him. ♡';$('note').classList.add('show')}
function update(){if(state!=='running')return;remaining=(deadline-Date.now())/1000;if(remaining<=0){win();return}draw()}function begin(){if(state!=='idle')return;mins=Math.max(1,Math.min(240,Number($('custom').value)||mins));remaining=mins*60;deadline=Date.now()+remaining*1000;state='running';save();$('start').textContent='Focus in progress… ♡';$('start').disabled=true;$('choices').hidden=true;setActivity(Math.floor(Math.random()*activities.length));stopActivities();activityTimer=setInterval(()=>setActivity(),11000);$('demo').hidden=true;tick=setInterval(update,250);draw()}function reset(){stopActivities();state='idle';clear();clearInterval(tick);$('scene').className='scene';$('caption').textContent='';$('bubble').textContent='Studying with you! ♡';$('boy').className='boy';$('danger').className='danger';$('danger').textContent='';$('sparkles').classList.remove('show');$('note').classList.remove('show');$('choices').hidden=false;$('start').hidden=false;$('start').disabled=false;$('start').textContent='Keep Him Alive ❤️';$('reset').hidden=true;$('demo').hidden=false;$('status').textContent='Another chance to save Lucien 💕';remaining=mins*60;draw()}document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{mins=Number(b.dataset.min);$('custom').value='';document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('active',x===b));remaining=mins*60;draw()});$('custom').oninput=()=>{if(Number($('custom').value)>0){document.querySelectorAll('[data-min]').forEach(x=>x.classList.remove('active'));mins=Math.min(240,Number($('custom').value));remaining=mins*60;draw()}};$('start').onclick=begin;$('reset').onclick=reset;$('demo').onclick=()=>{state='running';deadline=Date.now()+25000;lose()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running'){lose()}});window.addEventListener('pagehide',()=>{if(state==='running'){try{sessionStorage.setItem(key,JSON.stringify({state:'lost',deadline,mins}))}catch(e){}}});try{const old=JSON.parse(sessionStorage.getItem(key)||'null');if(old&&(old.state==='running'||old.state==='lost')){mins=old.mins||25;state='running';deadline=old.deadline||Date.now();lose()}}catch(e){}draw();
</script></body></html>
